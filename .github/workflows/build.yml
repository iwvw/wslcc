name: Build & Publish

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch Microsoft.WSL.Containers SDK
        shell: powershell
        run: ./scripts/fetch-wslc-sdk.ps1

      - name: Compute version
        id: version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v[0-9]') { $ver = $tag.Substring(1) } else { $ver = "0.1.0" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "ver=$ver"
          Write-Output "version=$ver"

      - name: Restore & Build
        run: dotnet build src/WSLCC.App/WSLCC.App.csproj -c Release -p:Platform=x64 -p:Version=${{ steps.version.outputs.ver }} -v:m

      - name: Publish (self-contained / merged)
        run: dotnet publish src/WSLCC.App/WSLCC.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:Version=${{ steps.version.outputs.ver }} -p:WSLCCFrameworkDependent=false -p:PublishTrimmed=false -p:PublishReadyToRun=false -o artifacts/publish -v:m

      - name: Publish (framework-dependent / separate)
        run: dotnet publish src/WSLCC.App/WSLCC.App.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:Version=${{ steps.version.outputs.ver }} -p:WSLCCFrameworkDependent=true -p:PublishTrimmed=false -p:PublishReadyToRun=false -o artifacts/publish-framework -v:m

      - name: Trim language resources
        shell: powershell
        run: |
          $keep = @("en-us", "en-US", "en-GB", "zh-CN", "zh-Hans", "zh-Hant", "zh-TW")
          foreach ($publish in @("artifacts/publish", "artifacts/publish-framework")) {
            Get-ChildItem "$publish" -Directory | Where-Object {
                $_.Name -match "^[a-z]{2,3}(-[A-Za-z]{2,8}){0,2}$" -and $_.Name -notin $keep
            } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Package zips
        shell: powershell
        run: |
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath artifacts/WSLCC-win-x64.zip -Force
          Compress-Archive -Path "artifacts/publish-framework/*" -DestinationPath artifacts/WSLCC-win-x64-framework.zip -Force

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: wslcc-zips
          path: |
            artifacts/WSLCC-win-x64.zip
            artifacts/WSLCC-win-x64-framework.zip
          if-no-files-found: error

      - name: Upload publish dirs
        uses: actions/upload-artifact@v4
        with:
          name: wslcc-publish
          path: |
            artifacts/publish
            artifacts/publish-framework
          if-no-files-found: error

      - name: Create installers
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "/DSourceDir=$PWD\artifacts\publish" "/DAppVersion=${{ steps.version.outputs.ver }}" "/DOutputDir=$PWD\artifacts" "/DOutputSuffix=" "/DFrameworkDependent=false" scripts\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "merged installer build failed" }
          & $iscc "/DSourceDir=$PWD\artifacts\publish-framework" "/DAppVersion=${{ steps.version.outputs.ver }}" "/DOutputDir=$PWD\artifacts" "/DOutputSuffix=-framework" "/DFrameworkDependent=true" scripts\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "framework installer build failed" }

      - name: Locate installers
        shell: powershell
        run: |
          $merged = Get-ChildItem "artifacts\WSLCC-Setup-${{ steps.version.outputs.ver }}.exe" | Select-Object -First 1
          $framework = Get-ChildItem "artifacts\WSLCC-Setup-${{ steps.version.outputs.ver }}-framework.exe" | Select-Object -First 1
          if (-not $merged) { throw "no merged installer produced" }
          if (-not $framework) { throw "no framework installer produced" }
          Copy-Item $merged.FullName artifacts\WSLCC-Setup.exe -Force
          Copy-Item $framework.FullName artifacts\WSLCC-Setup-framework.exe -Force
          Write-Output "merged: $($merged.FullName)"
          Write-Output "framework: $($framework.FullName)"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: wslcc-installers
          path: |
            artifacts/WSLCC-Setup.exe
            artifacts/WSLCC-Setup-framework.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/WSLCC-win-x64.zip
            artifacts/WSLCC-win-x64-framework.zip
            artifacts/WSLCC-Setup.exe
            artifacts/WSLCC-Setup-framework.exe
